name: selftest-standards

# The standards-* composite actions and the standards-core install paths, run on the
# stub product (standards/DESIGN.md §8.5, §12 stage 9):
#
#   actions   standards-install (override) of standards/tests/stubs/stub, then
#             standards-pr-policy on this pull request (this repository's own rules,
#             `major-free`), standards-release-ff as a dry run against a throwaway
#             branch, `stub-nix ci verdict` on recorded fetch-metadata cases, and
#             standards-update-branches against a branch no pull request targets
#   install   `uv tool install` of a product built on standards-core from a git URL, a
#             path and an override (standards/tests/test_install.py)
#   hardened  standards-install's hardened mode as a product's key-holding job runs it:
#             odoo-nix's tools from a flake.lock that locks Avunu/odoo-nix, hash-locked,
#             and refusals of the same lock pointing at another repository and at a
#             commit that is not on odoo-nix's main, of GH_HOST in the environment,
#             and of a uv in the tool cache that is not the pinned binary
#
# Nothing here writes to GitHub: the token is read-only, and every step that could
# write is a dry run or has nothing to act on.

on:
  pull_request:
    paths:
      - "standards/**"
      - ".github/actions/standards-*/**"
      - ".github/workflows/selftest-standards.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  actions:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 20
    permissions:
      contents: read # the checkout, the tags and refs the dry-run move reads
      pull-requests: read # the policy's pull request, and the open pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the policy walks base..head; the move reads the tags
          persist-credentials: false

      - id: install
        uses: ./.github/actions/standards-install
        with:
          cli: stub-nix
          engine-input: stub-nix
          env-prefix: STUB_NIX
          install-spec: "stub-nix-tools (unused with override)"
          python: "3.11"
          override: standards/tests/stubs/stub

      - name: The installed tools
        env:
          VERSION: ${{ steps.install.outputs.version }}
          REV: ${{ steps.install.outputs.rev }}
        run: |
          set -euo pipefail
          [ "$VERSION" = 1.0.0 ] || { echo "::error::version output is '$VERSION'"; exit 1; }
          [ -z "$REV" ] || { echo "::error::an override has no rev, got '$REV'"; exit 1; }
          [ "$STUB_NIX_ALLOW_SKEW" = 1 ] || { echo "::error::STUB_NIX_ALLOW_SKEW is not exported"; exit 1; }
          stub-nix data-path schema/core.schema.json

      # The policy runs `committed` from PATH (the stub's committed_argv default, as
      # this repository has no tools project).
      - name: committed
        run: uv tool install --python 3.11 committed==1.1.11

      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/standards-pr-policy
        with:
          cli: stub-nix
          integration: main
          major-free: "true"
          base-branch: main

      # The move reads the checkout's configuration: a throwaway checkout opted in to the
      # stub, beside this repository's own. The newest release tag and its commit are a
      # move the tags flow's guard accepts; the branch does not exist, so the dry run
      # would create it.
      - id: target
        name: A throwaway checkout and the newest release
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          [ -n "$tag" ] || { echo "::error::no v* tag to move to"; exit 1; }
          stub="$RUNNER_TEMP/stub-checkout"
          rm -rf "$stub"
          git init -q -b develop "$stub"
          printf '%s\n' '[project]' 'name = "demo_unit"' '' '[tool.stub-nix]' 'schema = 1' \
            'profile = "minimal"' 'major = 16' > "$stub/pyproject.toml"
          git -C "$stub" add pyproject.toml
          git -C "$stub" -c user.name=selftest -c user.email=selftest@example.org \
            commit -q -m "chore: a throwaway checkout"
          {
            echo "tag=$tag"
            echo "sha=$(git rev-list -n 1 "$tag")"
            echo "checkout=$stub"
          } >> "$GITHUB_OUTPUT"

      - id: release
        uses: ./.github/actions/standards-release-ff
        with:
          cli: stub-nix
          release-branch: standards-selftest/throwaway-${{ github.run_id }}
          sha: ${{ steps.target.outputs.sha }}
          tag: ${{ steps.target.outputs.tag }}
          token: ${{ github.token }}
          dry-run: "true"
          working-directory: ${{ steps.target.outputs.checkout }}

      - name: The dry run would have moved the branch
        env:
          MOVED: ${{ steps.release.outputs.moved }}
          SHA: ${{ steps.release.outputs.sha }}
          WANT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$MOVED" = true ] || { echo "::error::moved is '$MOVED'"; exit 1; }
          [ "$SHA" = "$WANT" ] || { echo "::error::sha is '$SHA', not $WANT"; exit 1; }

      # Recorded fetch-metadata outputs and the stub's decision table (the framework
      # product's, with neutral names): expected verdict, then the step's arguments.
      - name: ci verdict
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='|' read -r want args; do
            [ -n "$want" ] || continue
            eval "set -- $args"
            got="$(stub-nix ci verdict "$@")"
            if [ "$got" = "$want" ]; then
              echo "ok   $want: $args"
            else
              echo "::error::ci verdict $args: $got, not $want"
              failed=1
            fi
          done <<'EOF'
          auto|--ecosystem github_actions --dependency-names actions/checkout
          review|--ecosystem github_actions --dependency-names example/stub-nix --engine-repo example/stub-nix
          auto|--ecosystem github_actions --dependency-group actions --dependency-names a/b,c/d
          review|--ecosystem github_actions --dependency-group pilot --dependency-names example/pilot-x
          review|--ecosystem github_actions --dependency-names foo/docs-action --param 'docs-patterns=["foo/docs-*"]'
          review|--ecosystem github_actions --dependency-names foo/docs-action --docs-patterns '["foo/docs-*"]'
          auto|--ecosystem npm_and_yarn --update-type version-update:semver-minor --dependency-names x
          review|--ecosystem npm_and_yarn --directory /docs-site --update-type version-update:semver-minor --dependency-names x
          review|--ecosystem uv --update-type version-update:semver-major --dependency-names x
          auto|--ecosystem uv --update-type version-update:semver-patch --dependency-names x
          review|--ecosystem pre_commit --dependency-names https://github.com/example/test_utils
          auto|--ecosystem pre_commit --dependency-group hooks --dependency-names a,b
          close|--ecosystem nix --dependency-names stub-nix
          relock|--ecosystem nix --dependency-names nixpkgs
          auto|--ecosystem submodules --dependency-names x
          review|--ecosystem cargo --dependency-names x
          auto|--ecosystem cargo --dependency-names x --policy all
          EOF
          exit "$failed"

      # No pull request targets this branch, so there is nothing to update.
      - id: update
        uses: ./.github/actions/standards-update-branches
        with:
          cli: stub-nix
          integration: standards-selftest/no-pull-requests
          limit: "1"

      - name: Nothing was updated
        env:
          UPDATED: ${{ steps.update.outputs.updated }}
        run: |
          [ -z "$UPDATED" ] || { echo "::error::updated '$UPDATED'"; exit 1; }

  install:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: uv tool install from a git URL, a path and an override
        env:
          STANDARDS_CORE_INSTALL_CHECK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --no-project --python 3.11 --with-editable standards --with pytest
          pytest -q -p no:cacheprovider standards/tests/test_install.py

  hardened:
    # GitHub-hosted, where the products' jobs that hold the App's key run this mode.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # odoo-nix v2.8.1's merge commit: its py/odoo_nix_tools/uv.lock takes standards-core
      # from python-devops-nix by git, so both the hashed and the git paths run.
      # 929e392 is the head of odoo-nix#169, closed without merging: git fetch serves it
      # (refs/pull/169/head), but it is not on odoo-nix's main.
      - name: Checkouts that lock odoo-nix, from Avunu, from elsewhere, and off main
        env:
          REV: 071c77e412a574eeedeea304d149f358f84e1802
          UNMERGED: 929e392cd8b6bfc22e945718a4a6cee18fb186a1
        run: |
          set -euo pipefail
          lock() {
            mkdir -p "$RUNNER_TEMP/lock-$1"
            jq -n --arg owner "$2" --arg rev "$3" '{
              nodes: {root: {inputs: {"odoo-nix": "odoo-nix"}},
                      "odoo-nix": {locked: {type: "github", owner: $owner, repo: "odoo-nix", rev: $rev}}},
              root: "root", version: 7}' > "$RUNNER_TEMP/lock-$1/flake.lock"
          }
          lock Avunu Avunu "$REV"
          lock someone-else someone-else "$REV"
          lock unmerged Avunu "$UNMERGED"

      - id: install
        uses: ./.github/actions/standards-install
        with:
          cli: odoo-nix
          engine-input: odoo-nix
          env-prefix: ODOO_NIX
          install-spec: "unused with hardened"
          hardened: "true"
          source: Avunu/odoo-nix
          project: py/odoo_nix_tools
          git-sources: Avunu/python-devops-nix
          working-directory: ${{ runner.temp }}/lock-Avunu

      - name: The hash-locked tools
        env:
          VERSION: ${{ steps.install.outputs.version }}
          REV: ${{ steps.install.outputs.rev }}
        run: |
          set -euo pipefail
          [ "$VERSION" = 2.8.1 ] || { echo "::error::version output is '$VERSION'"; exit 1; }
          [ "$REV" = 071c77e412a574eeedeea304d149f358f84e1802 ] || { echo "::error::rev output is '$REV'"; exit 1; }
          [ "$ODOO_NIX_EXPECT_REV" = "$REV" ] || { echo "::error::ODOO_NIX_EXPECT_REV is '$ODOO_NIX_EXPECT_REV'"; exit 1; }
          [ "$UV_NO_CACHE" = 1 ] || { echo "::error::UV_NO_CACHE is not exported"; exit 1; }
          [ "$UV_NO_CONFIG" = 1 ] || { echo "::error::UV_NO_CONFIG is not exported"; exit 1; }
          # The venv's interpreter is the CPython the pinned uv installed, not the runner's.
          grep -qx "home = $RUNNER_TEMP/standards-tools/python/.*" "$RUNNER_TEMP/standards-tools/venv/pyvenv.cfg" \
            || { echo "::error::the venv's interpreter is not uv's: $(grep '^home' "$RUNNER_TEMP/standards-tools/venv/pyvenv.cfg")"; exit 1; }
          [ "$(command -v odoo-nix)" = "$RUNNER_TEMP/standards-tools/bin/odoo-nix" ] \
            || { echo "::error::odoo-nix on PATH is $(command -v odoo-nix)"; exit 1; }
          # Later steps find the uv whose binary was checked, not setup-uv's.
          [ "$(command -v uv)" = "$RUNNER_TEMP/standards-uv/uv" ] \
            || { echo "::error::uv on PATH is $(command -v uv)"; exit 1; }
          # standards-core came from git, and says at which commit (the version-skew row).
          core="$("$RUNNER_TEMP/standards-tools/venv/bin/python" -I -c 'import standards_core; print(standards_core.revision())')"
          [ "$core" = 623a91761baed55e66967d56559dd086b2df9f59 ] || { echo "::error::standards-core revision is '$core'"; exit 1; }

      - id: elsewhere
        continue-on-error: true
        uses: ./.github/actions/standards-install
        with:
          cli: odoo-nix
          engine-input: odoo-nix
          env-prefix: ODOO_NIX
          install-spec: "unused with hardened"
          hardened: "true"
          source: Avunu/odoo-nix
          project: py/odoo_nix_tools
          git-sources: Avunu/python-devops-nix
          working-directory: ${{ runner.temp }}/lock-someone-else

      - name: A lock from another repository is refused
        env:
          OUTCOME: ${{ steps.elsewhere.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the install from someone-else/odoo-nix was '$OUTCOME'"; exit 1; }

      - id: unmerged
        continue-on-error: true
        uses: ./.github/actions/standards-install
        with:
          cli: odoo-nix
          engine-input: odoo-nix
          env-prefix: ODOO_NIX
          install-spec: "unused with hardened"
          hardened: "true"
          source: Avunu/odoo-nix
          project: py/odoo_nix_tools
          git-sources: Avunu/python-devops-nix
          working-directory: ${{ runner.temp }}/lock-unmerged

      - name: A commit that is not on the source's default branch is refused
        env:
          OUTCOME: ${{ steps.unmerged.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the install of an unmerged odoo-nix commit was '$OUTCOME'"; exit 1; }

      # gh would send GH_TOKEN, the App's token in a product's key job, to GH_HOST.
      - id: gh-host
        continue-on-error: true
        uses: ./.github/actions/standards-install
        env:
          GH_HOST: example.invalid
        with:
          cli: odoo-nix
          engine-input: odoo-nix
          env-prefix: ODOO_NIX
          install-spec: "unused with hardened"
          hardened: "true"
          source: Avunu/odoo-nix
          project: py/odoo_nix_tools
          git-sources: Avunu/python-devops-nix
          working-directory: ${{ runner.temp }}/lock-Avunu

      - name: GH_HOST in the job's environment is refused
        env:
          OUTCOME: ${{ steps.gh-host.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the install with GH_HOST set was '$OUTCOME'"; exit 1; }

      # Last, since it changes the runner's tool cache: setup-uv finds 0.13.6 there and
      # checks nothing, so install.sh's own check of the binary is what refuses it.
      - name: Change the uv in the tool cache
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' uv; do
            printf '\n' >>"$uv"
            echo "changed $uv"
            found=1
          done < <(find "$RUNNER_TOOL_CACHE/uv/0.13.6" -type f -name uv -print0)
          [ "$found" = 1 ] || { echo "::error::no uv 0.13.6 in the tool cache"; exit 1; }

      - id: tampered
        continue-on-error: true
        uses: ./.github/actions/standards-install
        with:
          cli: odoo-nix
          engine-input: odoo-nix
          env-prefix: ODOO_NIX
          install-spec: "unused with hardened"
          hardened: "true"
          source: Avunu/odoo-nix
          project: py/odoo_nix_tools
          git-sources: Avunu/python-devops-nix
          working-directory: ${{ runner.temp }}/lock-Avunu

      - name: A uv in the tool cache that is not the pinned binary is refused
        env:
          OUTCOME: ${{ steps.tampered.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the install with a changed cached uv was '$OUTCOME'"; exit 1; }
