name: selftest-standards

# The standards-* composite actions and the standards-core install paths, run on the
# stub product (standards/DESIGN.md §8.5, §12 stage 9):
#
#   actions   standards-install (override) of standards/tests/stubs/stub, then
#             standards-pr-policy on this pull request (this repository's own rules,
#             `major-free`), standards-release-ff as a dry run against a throwaway
#             branch, `stub-nix ci verdict` on recorded fetch-metadata cases, and
#             standards-update-branches against a branch no pull request targets
#   install   `uv tool install` of a product built on standards-core from a git URL, a
#             path and an override (standards/tests/test_install.py)
#
# Nothing here writes to GitHub: the token is read-only, and every step that could
# write is a dry run or has nothing to act on.

on:
  pull_request:
    paths:
      - "standards/**"
      - ".github/actions/standards-*/**"
      - ".github/workflows/selftest-standards.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  actions:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 20
    permissions:
      contents: read # the checkout, the tags and refs the dry-run move reads
      pull-requests: read # the policy's pull request, and the open pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the policy walks base..head; the move reads the tags
          persist-credentials: false

      - id: install
        uses: ./.github/actions/standards-install
        with:
          cli: stub-nix
          engine-input: stub-nix
          env-prefix: STUB_NIX
          install-spec: "stub-nix-tools (unused with override)"
          python: "3.11"
          override: standards/tests/stubs/stub

      - name: The installed tools
        env:
          VERSION: ${{ steps.install.outputs.version }}
          REV: ${{ steps.install.outputs.rev }}
        run: |
          set -euo pipefail
          [ "$VERSION" = 1.0.0 ] || { echo "::error::version output is '$VERSION'"; exit 1; }
          [ -z "$REV" ] || { echo "::error::an override has no rev, got '$REV'"; exit 1; }
          [ "$STUB_NIX_ALLOW_SKEW" = 1 ] || { echo "::error::STUB_NIX_ALLOW_SKEW is not exported"; exit 1; }
          stub-nix data-path schema/core.schema.json

      # The policy runs `committed` from PATH (the stub's committed_argv default, as
      # this repository has no tools project).
      - name: committed
        run: uv tool install --python 3.11 committed==1.1.11

      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/standards-pr-policy
        with:
          cli: stub-nix
          integration: main
          major-free: "true"
          base-branch: main

      # The move reads the checkout's configuration: a throwaway checkout opted in to the
      # stub, beside this repository's own. The newest release tag and its commit are a
      # move the tags flow's guard accepts; the branch does not exist, so the dry run
      # would create it.
      - id: target
        name: A throwaway checkout and the newest release
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          [ -n "$tag" ] || { echo "::error::no v* tag to move to"; exit 1; }
          stub="$RUNNER_TEMP/stub-checkout"
          rm -rf "$stub"
          git init -q -b develop "$stub"
          printf '%s\n' '[project]' 'name = "demo_unit"' '' '[tool.stub-nix]' 'schema = 1' \
            'profile = "minimal"' 'major = 16' > "$stub/pyproject.toml"
          git -C "$stub" add pyproject.toml
          git -C "$stub" -c user.name=selftest -c user.email=selftest@example.org \
            commit -q -m "chore: a throwaway checkout"
          {
            echo "tag=$tag"
            echo "sha=$(git rev-list -n 1 "$tag")"
            echo "checkout=$stub"
          } >> "$GITHUB_OUTPUT"

      - id: release
        uses: ./.github/actions/standards-release-ff
        with:
          cli: stub-nix
          release-branch: standards-selftest/throwaway-${{ github.run_id }}
          sha: ${{ steps.target.outputs.sha }}
          tag: ${{ steps.target.outputs.tag }}
          token: ${{ github.token }}
          dry-run: "true"
          working-directory: ${{ steps.target.outputs.checkout }}

      - name: The dry run would have moved the branch
        env:
          MOVED: ${{ steps.release.outputs.moved }}
          SHA: ${{ steps.release.outputs.sha }}
          WANT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$MOVED" = true ] || { echo "::error::moved is '$MOVED'"; exit 1; }
          [ "$SHA" = "$WANT" ] || { echo "::error::sha is '$SHA', not $WANT"; exit 1; }

      # Recorded fetch-metadata outputs and the stub's decision table (the framework
      # product's, with neutral names): expected verdict, then the step's arguments.
      - name: ci verdict
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='|' read -r want args; do
            [ -n "$want" ] || continue
            eval "set -- $args"
            got="$(stub-nix ci verdict "$@")"
            if [ "$got" = "$want" ]; then
              echo "ok   $want: $args"
            else
              echo "::error::ci verdict $args: $got, not $want"
              failed=1
            fi
          done <<'EOF'
          auto|--ecosystem github_actions --dependency-names actions/checkout
          review|--ecosystem github_actions --dependency-names example/stub-nix --engine-repo example/stub-nix
          auto|--ecosystem github_actions --dependency-group actions --dependency-names a/b,c/d
          review|--ecosystem github_actions --dependency-group pilot --dependency-names example/pilot-x
          review|--ecosystem github_actions --dependency-names foo/docs-action --param 'docs-patterns=["foo/docs-*"]'
          review|--ecosystem github_actions --dependency-names foo/docs-action --docs-patterns '["foo/docs-*"]'
          auto|--ecosystem npm_and_yarn --update-type version-update:semver-minor --dependency-names x
          review|--ecosystem npm_and_yarn --directory /docs-site --update-type version-update:semver-minor --dependency-names x
          review|--ecosystem uv --update-type version-update:semver-major --dependency-names x
          auto|--ecosystem uv --update-type version-update:semver-patch --dependency-names x
          review|--ecosystem pre_commit --dependency-names https://github.com/example/test_utils
          auto|--ecosystem pre_commit --dependency-group hooks --dependency-names a,b
          close|--ecosystem nix --dependency-names stub-nix
          relock|--ecosystem nix --dependency-names nixpkgs
          auto|--ecosystem submodules --dependency-names x
          review|--ecosystem cargo --dependency-names x
          auto|--ecosystem cargo --dependency-names x --policy all
          EOF
          exit "$failed"

      # No pull request targets this branch, so there is nothing to update.
      - id: update
        uses: ./.github/actions/standards-update-branches
        with:
          cli: stub-nix
          integration: standards-selftest/no-pull-requests
          limit: "1"

      - name: Nothing was updated
        env:
          UPDATED: ${{ steps.update.outputs.updated }}
        run: |
          [ -z "$UPDATED" ] || { echo "::error::updated '$UPDATED'"; exit 1; }

  install:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          tool-dir: ${{ runner.temp }}/uv-tool-dir
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

      - name: uv tool install from a git URL, a path and an override
        env:
          STANDARDS_CORE_INSTALL_CHECK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --no-project --python 3.11 --with-editable standards --with pytest
          pytest -q -p no:cacheprovider standards/tests/test_install.py
