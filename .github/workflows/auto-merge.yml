name: auto-merge

# This repository's Dependabot pull requests, through the reusable workflows the products
# call: the nix and pre-commit ones auto-merge once the required checks ("lint", "checks",
# "downstream") pass, and each one that falls behind main is brought up to date
# (dependabot-update-branches.yml). The products call them pinned to a commit; this
# repository calls its own copies at the same revision.
#
# Every github-actions pull request is reviewed by a person (exclude-ecosystems), and the
# reusable workflow's `diff` job holds one whose diff touches a workflow or an action file
# whatever fetch-metadata says. Every action pinned here runs where the org App's key can
# be read: on a pull request this repository runs its own dependabot-auto-merge.yml at the
# pull request's head, whose auto-merge job would hand APP_PRIVATE_KEY to a bumped
# create-github-app-token before review; and the composite actions here (standards-install's
# setup-uv, standards-deps-automerge's fetch-metadata, …) and the action pins the products
# copy from here run in the products' jobs that hold the key. A list of those actions goes
# stale the day a key job adds one; the ecosystem does not. review-dependencies names the
# ones such jobs run today (here: create-github-app-token; in the products' release,
# relock-push, automerge, sync and update-branches jobs: checkout, download-artifact,
# setup-uv, fetch-metadata, release-please-action), so `diff` holds a bump of one even if
# Dependabot files it under another ecosystem. The cost is one grouped pull request a day at
# most (a seven-day cooldown, one group) for a person to merge.
#
# The org's GitHub App (the variable AVUNU_CI_APP_ID, or a Dependabot secret of that name,
# and the secret AVUNU_CI_PRIVATE_KEY) enables auto-merge and updates the branches, so a
# merge raises a push that starts check.yml and release.yml on main, and an updated branch
# starts its checks. Without it, GITHUB_TOKEN, and check.yml is dispatched on an updated
# branch.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dependabot:
    # The pull request's author, not github.actor (which a re-run by a person changes).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    uses: ./.github/workflows/dependabot-auto-merge.yml
    with:
      exclude-ecosystems: github_actions
      review-dependencies: >-
        actions/create-github-app-token actions/checkout actions/download-artifact
        astral-sh/setup-uv dependabot/fetch-metadata googleapis/release-please-action
    # A Dependabot run sees only Dependabot secrets: the App's ID is one too.
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID || secrets.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}

  update-branches:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # update-branch without the App
      pull-requests: write # update-branch
      actions: write # without the App, dispatch check.yml on the updated branch
    uses: ./.github/workflows/dependabot-update-branches.yml
    with:
      dispatch: check.yml
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
