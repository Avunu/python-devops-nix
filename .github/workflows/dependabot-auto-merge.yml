name: Dependabot auto-merge

# Reusable: enables auto-merge on a Dependabot pull request that the caller's policy
# allows. GitHub then merges it once the branch is mergeable and every *required* status
# check passes, so the required checks are what this merges on; without them it merges
# on nothing. A pull request whose checks fail stays open.
#
# A repository calls it from its own workflow, pinned to a commit with the version in a
# comment, so Dependabot's github-actions entry moves the pin. With a GitHub App, which
# the caller passes as two secrets, the App enables auto-merge, so the merge GitHub makes
# raises a push that starts the default branch's workflows (release-please's among them);
# with GITHUB_TOKEN it raises none:
#
#   on: pull_request
#   permissions: {}
#   jobs:
#     auto-merge:
#       if: github.event.pull_request.user.login == 'dependabot[bot]'
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@<sha> # vX.Y.Z
#       # with:
#       #   update-types: major minor patch other
#       #   exclude-ecosystems: ""
#       #   merge-method: squash
#       # A Dependabot run sees only Dependabot secrets: the App's ID may be one too.
#       secrets:
#         APP_ID: ${{ vars.ORG_CI_APP_ID || secrets.ORG_CI_APP_ID }}
#         APP_PRIVATE_KEY: ${{ secrets.ORG_CI_PRIVATE_KEY }}
#
# dependabot-update-branches.yml keeps the same pull requests up to date with the base
# branch. This repository calls both, from auto-merge.yml.
#
# Requires (one-time, in the caller's settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches (or Rules) → protect the default branch and require the checks
#     a merge must wait for

on:
  workflow_call:
    inputs:
      update-types:
        description: >-
          Space-separated update types to auto-merge: major, minor and patch (semver), and
          other, an update with no semver type, such as a flake input or a git revision.
          Every one by default: the required checks are the gate, not the update type.
        type: string
        default: major minor patch other
      exclude-ecosystems:
        description: >-
          Space-separated package ecosystems whose pull requests a person reviews instead,
          as dependabot/fetch-metadata names them: the segment after dependabot/ in the
          pull request's branch, such as github_actions or npm_and_yarn. None by default:
          every ecosystem auto-merges, action bumps included, whose required checks run
          the bumped actions before the merge.
        type: string
        default: ""
      merge-method:
        description: How GitHub merges once the checks pass, as `gh pr merge` takes it.
        type: string
        default: squash
    secrets:
      APP_ID:
        description: >-
          The ID (or client ID) of a GitHub App installed on the repository with Contents
          and Pull requests write. With APP_PRIVATE_KEY, the App's token enables auto-merge,
          so the merge raises a push. Without them, GITHUB_TOKEN does.
        required: false
      APP_PRIVATE_KEY:
        description: The GitHub App's private key (PEM).
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    # The pull request's author, not github.actor (which a re-run by a person changes).
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the policy
        id: policy
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATE_TYPES: ${{ inputs.update-types }}
          EXCLUDE_ECOSYSTEMS: ${{ inputs.exclude-ecosystems }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          case "$MERGE_METHOD" in
            squash | merge | rebase) ;;
            *) echo "::error::merge-method must be squash, merge or rebase, not '$MERGE_METHOD'"; exit 1 ;;
          esac
          type=${UPDATE_TYPE#version-update:semver-}
          type=${type:-other}
          merge=true
          if [[ " $EXCLUDE_ECOSYSTEMS " == *" $ECOSYSTEM "* ]]; then
            echo "::notice::$ECOSYSTEM updates are reviewed by a person (exclude-ecosystems)"
            merge=false
          elif [[ " $UPDATE_TYPES " != *" $type "* ]]; then
            echo "::notice::$type updates are reviewed by a person (update-types: $UPDATE_TYPES)"
            merge=false
          fi
          echo "$ECOSYSTEM, $type update: auto-merge $merge"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: Whether the caller passed a GitHub App
        id: app
        if: steps.policy.outputs.merge == 'true'
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - name: Mint the GitHub App's token
        id: app-token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: steps.policy.outputs.merge == 'true'
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            echo "auto-merge is already enabled on $PR_URL"
            exit 0
          fi
          gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
