name: Dependabot auto-merge

# Reusable: enables auto-merge on a Dependabot pull request that the caller's policy
# allows. GitHub then merges it once the branch is mergeable and every *required* status
# check passes, so the required checks are what this merges on; without them it merges
# on nothing. A pull request whose checks fail stays open.
#
# A repository calls it from its own workflow, pinned to a commit with the version in a
# comment, so Dependabot's github-actions entry moves the pin. With a GitHub App, which
# the caller passes as two secrets, the App enables auto-merge, so the merge GitHub makes
# raises a push that starts the default branch's workflows (release-please's among them);
# with GITHUB_TOKEN it raises none:
#
#   on: pull_request
#   permissions: {}
#   jobs:
#     auto-merge:
#       if: github.event.pull_request.user.login == 'dependabot[bot]'
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@<sha> # vX.Y.Z
#       # with:
#       #   update-types: major minor patch other
#       #   exclude-ecosystems: github_actions
#       #   review-dependencies: actions/create-github-app-token
#       #   merge-method: squash
#       # A Dependabot run sees only Dependabot secrets: the App's ID may be one too.
#       secrets:
#         APP_ID: ${{ vars.ORG_CI_APP_ID || secrets.ORG_CI_APP_ID }}
#         APP_PRIVATE_KEY: ${{ secrets.ORG_CI_PRIVATE_KEY }}
#
# dependabot-update-branches.yml keeps the same pull requests up to date with the base
# branch. This repository calls both, from auto-merge.yml.
#
# Every job runs on GitHub-hosted ubuntu-latest, whatever runners the caller uses: the one
# that mints the App's token holds its private key (see the job). Two jobs without the
# key must both say merge before it runs: `policy`, from dependabot/fetch-metadata, and
# `diff`, from the pull request's own diff with nothing but gh, so a bumped
# fetch-metadata cannot wave through a pull request that changes what the key job runs.
#
# Requires (one-time, in the caller's settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches (or Rules) → protect the default branch and require the checks
#     a merge must wait for

on:
  workflow_call:
    inputs:
      update-types:
        description: >-
          Space-separated update types to auto-merge: major, minor and patch (semver), and
          other, an update with no semver type, such as a flake input or a git revision.
          Every one by default: the required checks are the gate, not the update type.
        type: string
        default: major minor patch other
      exclude-ecosystems:
        description: >-
          Space-separated package ecosystems whose pull requests a person reviews instead,
          as dependabot/fetch-metadata names them: the segment after dependabot/ in the
          pull request's branch, such as github_actions or npm_and_yarn. With
          github_actions, a pull request whose diff changes a workflow or an action file
          (.github/workflows/, .github/actions/, action.yml) is reviewed too, whatever
          fetch-metadata says. None by default: every ecosystem auto-merges, action bumps
          included, whose required checks run the bumped actions before the merge.
        type: string
        default: ""
      review-dependencies:
        description: >-
          Space-separated dependency names whose pull requests a person reviews instead,
          as dependabot/fetch-metadata names them (`actions/create-github-app-token`): a
          pull request that updates any of them, alone or in a group, is not auto-merged,
          and its auto-merge job, the one that holds APP_PRIVATE_KEY, does not run. Held
          when fetch-metadata names one, and when the pull request's diff changes a
          `<name>@` reference to one (`diff`). A caller that calls this workflow at its
          own revision (`./.github/workflows/…`) lists every action that runs in a job
          holding the key, and better excludes github_actions, so a bump of one never
          runs with the key before a person reviews it. None by default.
        type: string
        default: ""
      merge-method:
        description: How GitHub merges once the checks pass, as `gh pr merge` takes it.
        type: string
        default: squash
    secrets:
      APP_ID:
        description: >-
          The ID (or client ID) of a GitHub App installed on the repository with Contents
          and Pull requests write. With APP_PRIVATE_KEY, the App's token enables auto-merge,
          so the merge raises a push. Without them, GITHUB_TOKEN does.
        required: false
      APP_PRIVATE_KEY:
        description: The GitHub App's private key (PEM).
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Decides from Dependabot's metadata, and holds no App key: dependabot/fetch-metadata
  # runs here, apart from the job that mints the App's token.
  policy:
    # GitHub-hosted, never self-hosted: a shared self-hosted runner keeps state between
    # jobs, which could change what this decides.
    runs-on: ubuntu-latest
    # The pull request's author, not github.actor (which a re-run by a person changes).
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: read # fetch-metadata reads the pull request's commits
      pull-requests: read # and the pull request
    outputs:
      merge: ${{ steps.policy.outputs.merge }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the policy
        id: policy
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATE_TYPES: ${{ inputs.update-types }}
          EXCLUDE_ECOSYSTEMS: ${{ inputs.exclude-ecosystems }}
          REVIEW_DEPENDENCIES: ${{ inputs.review-dependencies }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          case "$MERGE_METHOD" in
            squash | merge | rebase) ;;
            *) echo "::error::merge-method must be squash, merge or rebase, not '$MERGE_METHOD'"; exit 1 ;;
          esac
          type=${UPDATE_TYPE#version-update:semver-}
          type=${type:-other}
          merge=true
          # fetch-metadata lists the names comma-separated; compared one by one, without case.
          review=""
          listed=""
          IFS=', ' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            [ -n "$name" ] && listed=1
            for wanted in $REVIEW_DEPENDENCIES; do
              if [ "${name,,}" = "${wanted,,}" ]; then review="$name"; fi
            done
          done
          if [ -n "$REVIEW_DEPENDENCIES" ] && [ -z "$listed" ]; then
            echo "::notice::fetch-metadata names no dependency, so none of review-dependencies can be ruled out: reviewed by a person"
            merge=false
          elif [ -n "$review" ]; then
            echo "::notice::$review updates are reviewed by a person (review-dependencies)"
            merge=false
          elif [[ " $EXCLUDE_ECOSYSTEMS " == *" $ECOSYSTEM "* ]]; then
            echo "::notice::$ECOSYSTEM updates are reviewed by a person (exclude-ecosystems)"
            merge=false
          elif [[ " $UPDATE_TYPES " != *" $type "* ]]; then
            echo "::notice::$type updates are reviewed by a person (update-types: $UPDATE_TYPES)"
            merge=false
          fi
          echo "$ECOSYSTEM, $type update: auto-merge $merge"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

  # Reads the pull request's own diff, from its base to the head this run is for, with
  # only bash and the runner's gh: no action, so nothing a Dependabot bump changes runs
  # here. A changed `<name>@` reference to a review-dependencies name, or with
  # exclude-ecosystems github_actions a changed workflow or action file, holds it. A
  # diff it cannot read holds it too.
  diff:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: read # the compare of base and head
    outputs:
      merge: ${{ steps.diff.outputs.merge }}
    steps:
      - name: Scan the pull request's diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EXCLUDE_ECOSYSTEMS: ${{ inputs.exclude-ecosystems }}
          REVIEW_DEPENDENCIES: ${{ inputs.review-dependencies }}
        run: |
          set -euo pipefail
          merge=true
          hold() {
            echo "::notice::$*: reviewed by a person"
            merge=false
          }
          diff="$RUNNER_TEMP/pull-request.diff"
          if ! gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/compare/$BASE...$HEAD" >"$diff"; then
            hold "the pull request's diff could not be read"
          else
            # The lines it adds or removes, and the files it touches.
            changed="$(grep -E '^[-+]' "$diff" | grep -vE '^(\+\+\+|---) ' || true)"
            files="$(grep -E '^diff --git ' "$diff" || true)"
            for wanted in $REVIEW_DEPENDENCIES; do
              if ! [[ "$wanted" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]; then
                echo "::error::review-dependencies must list dependency names, not '$wanted'"
                exit 1
              fi
              # `<name>@` or `<name>/<path>@`, without case, as a `uses:` names it.
              if grep -qiE "(^|[^A-Za-z0-9_./-])${wanted//./\\.}(/[^@[:space:]]*)?@" <<<"$changed"; then
                hold "the diff changes a reference to $wanted (review-dependencies)"
              fi
            done
            if [[ " $EXCLUDE_ECOSYSTEMS " == *" github_actions "* ]] &&
              grep -qE '(^diff --git a/|/)(\.github/(workflows|actions)/|action\.ya?ml( |$))' <<<"$files"; then
              hold "the diff changes a workflow or an action (exclude-ecosystems: github_actions)"
            fi
          fi
          echo "diff: auto-merge $merge"
          echo "merge=$merge" >>"$GITHUB_OUTPUT"

  # Mints the App's token and enables auto-merge. It holds APP_PRIVATE_KEY, so it runs
  # on a GitHub-hosted runner, a fresh machine for each job, never on a shared self-hosted
  # one whose earlier jobs (any repository's, a dependency's, a fork's) could read the key
  # or the token. It checks nothing out and runs only GitHub's create-github-app-token
  # and the runner's gh. Any action in this job could read the key, so a bump of
  # create-github-app-token in a caller that runs this workflow at its own revision is
  # held by review-dependencies (or exclude-ecosystems: github_actions) and `diff`.
  auto-merge:
    needs: [policy, diff]
    if: ${{ needs.policy.outputs.merge == 'true' && needs.diff.outputs.merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Whether the caller passed a GitHub App
        id: app
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      # An App that is not installed on the repository falls back to GITHUB_TOKEN.
      - name: Mint the GitHub App's token
        id: app-token
        if: steps.app.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Only at the head this run is for, the one `diff` read: a pull request that moved
      # since merges on the run its new head starts, not on this one.
      - name: Enable auto-merge
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            echo "auto-merge is already enabled on $PR_URL"
            exit 0
          fi
          gh pr merge --auto "--$MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
