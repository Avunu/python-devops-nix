name: Dependabot auto-merge

# Enables auto-merge on every Dependabot PR. GitHub then merges it once the branch is
# mergeable and all *required* status checks pass — so protect `main` and mark the
# checks you trust as required, otherwise this merges on nothing.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches → protect `main`, require the "lint", "checks" and
#     "downstream" status checks
#
# Copied from frappe-nix; PLAN.md's Phase 7 turns it into a reusable workflow here.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Updates of the actions pinned in the workflows (github-actions pull requests) are
    # reviewed by a person.
    if: ${{ github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
