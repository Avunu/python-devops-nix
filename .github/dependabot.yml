version: 2

# Keeps this repository's dependencies up to date. Pull requests, action bumps included,
# auto-merge once the required checks go green and are kept up to date with main (see
# .github/workflows/auto-merge.yml, which calls the reusable dependabot-auto-merge.yml and
# dependabot-update-branches.yml).
#
# The shape both products follow (docs/conventions.md, Dependabot): a seven-day cooldown
# and one group per ecosystem, so each ecosystem is one pull request.
#
# Commit prefixes (docs/releases.md): `fix(deps)` for what ships to the products, so a
# bump cuts a patch release; `chore(deps)` for what only this repository runs, which
# releases nothing. The products' flake inputs `follows` this flake's nixpkgs and
# flake-parts, so its own flake.lock reaches no product, and their copies of
# .pre-commit-config.yaml are compared without `rev`. The github-actions group mixes pins
# that ship (the composite actions in .github/actions, and fetch-metadata in the reusable
# dependabot-auto-merge.yml) with pins only this repository's CI runs, and an entry has one
# prefix. It takes `fix(deps)`, so a bump of CI-only pins also cuts a patch release, one
# that changes nothing for the products. That is accepted.
updates:
  # Nix flake inputs: nixpkgs and flake-parts. Dependabot reads flake.lock directly.
  # Weekly, not daily: nixpkgs tracks nixos-unstable and moves constantly. Grouped so
  # nixpkgs and flake-parts (whose nixpkgs-lib follows nixpkgs) move together.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      nix:
        patterns: ["*"]

  # The hook revs in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows (`/`) and by the composite
  # actions in .github/actions, pinned by commit with the version in a trailing comment;
  # Dependabot moves both. One group across the directories, so one pull request.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    groups:
      github-actions:
        patterns: ["*"]
