version: 2

# Keeps this repository's dependencies up to date. Pull requests auto-merge once the
# required checks go green, except action bumps, which a person reviews (see
# .github/workflows/auto-merge.yml, which calls the reusable dependabot-auto-merge.yml).
#
# The shape both products follow (docs/conventions.md, Dependabot): a seven-day cooldown
# and one group per ecosystem, so each ecosystem is one pull request.
#
# Commit prefixes (docs/releases.md): `fix(deps)` for what ships to the products, so a
# bump cuts a patch release; `chore(deps)` for what only this repository runs, which
# releases nothing. The products' flake inputs `follows` this flake's nixpkgs and
# flake-parts, so its own flake.lock reaches no product, and their copies of
# .pre-commit-config.yaml are compared without `rev`. The action pins do ship: the
# reusable dependabot-auto-merge.yml runs them in the products.
updates:
  # Nix flake inputs: nixpkgs and flake-parts. Dependabot reads flake.lock directly.
  # Weekly, not daily: nixpkgs tracks nixos-unstable and moves constantly. Grouped so
  # nixpkgs and flake-parts (whose nixpkgs-lib follows nixpkgs) move together.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      nix:
        patterns: ["*"]

  # The hook revs in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows, pinned by commit with the
  # version in a trailing comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    groups:
      github-actions:
        patterns: ["*"]
