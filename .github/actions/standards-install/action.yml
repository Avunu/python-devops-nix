name: Install a product's standards tools
description: >-
  Installs a product's standards tools (its console script, built on standards-core)
  at the engine revision the checkout's flake.lock pins, so the tools a job runs are
  the ones its sync was rendered with: with `uv tool install`, or with `hardened`, from
  the engine's committed uv.lock by hash. Exports the expected revision for the skew
  check.

# A product's workflow job, before any other standards-* action (standards/DESIGN.md
# §8.5). A caller pins it by SHA, as every action:
#
#   - uses: <owner>/python-devops-nix/.github/actions/standards-install@<sha> # vX.Y.Z
#     with:
#       cli: kit-nix
#       engine-input: kit-nix
#       env-prefix: KIT_NIX
#       install-spec: >-
#         kit-nix-tools @ git+https://github.com/{owner}/{repo}@{rev}#subdirectory=py/kit_nix_tools
#
# `{owner}`, `{repo}` and `{rev}` are the engine node flake.lock locks: a fork the
# checkout locks installs from that fork. With `override` (a product's own self-test),
# the tools are installed from a path in the workspace instead, and the skew check is
# turned off (<P>_ALLOW_SKEW=1, an empty <P>_EXPECT_REV).
#
# `hardened: "true"` is for a job that can hold a secret worth stealing (a GitHub App's
# private key): nothing it installs is resolved at run time. The engine must be locked
# from `source` (owner/repo) at a full revision; `project` in it is fetched from
# https://github.com/<source> at that revision, every dependency is installed from the
# project's committed uv.lock (`uv export --frozen`) by hash and as a wheel
# (`--require-hashes --no-build`), a git dependency only from a `git-sources` repository
# at a full revision, and only the project and those git dependencies are built, offline,
# against the hashed `build-requirements`. The engine's revision and each git
# dependency's must be on that repository's protected default branch (read with the
# job's github.token, never the App's), so a pull request's head or a fork's commit,
# which `git fetch` would also serve, is refused. uv is pinned and its binary checked
# against its sha256 (setup-uv checks the release asset only when it downloads it, not
# on a warm tool cache), reads no configuration, and runs without its cache (setup-uv's
# and UV_NO_CACHE=1), under an empty environment, on the CPython it installs itself.
# UV_NO_CACHE=1 and UV_NO_CONFIG=1 are exported for the rest of the job, the checked uv
# goes first on PATH, and a job environment an earlier step could have set to steer uv,
# git, gh, Python or TLS for the later steps (GH_HOST, GIT_SSH_COMMAND, LD_PRELOAD,
# proxies, CA bundles, PYTHONPATH, …), or a git or gh not the image's, is refused. That
# guards the later steps against an earlier step's environment only: an earlier step in
# the job can still tamper with the runner. Only on a GitHub-hosted Linux X64 runner.
# `install-spec` is not used. Off by default, so an existing caller installs as before:
#
#     with:
#       ...
#       hardened: "true"
#       source: Kit/kit-nix
#       project: py/kit_nix_tools
#       git-sources: <owner>/python-devops-nix

inputs:
  cli:
    description: The product's console script, which the later steps run (`kit-nix`).
    required: true
  engine-input:
    description: The root flake input every checkout locks the engine as (`kit-nix`).
    required: true
  install-spec:
    description: >-
      What `uv tool install` installs, with `{owner}`, `{repo}` and `{rev}` replaced by
      the engine node's locked owner, repository and revision. Not used with `hardened`.
    required: true
  env-prefix:
    description: The product's environment prefix (`KIT_NIX`); every variable is `<P>_<X>`.
    required: true
  python:
    description: >-
      The interpreter `uv tool install --python` uses. With `hardened`, the CPython
      version (`3.12`) the pinned uv installs from its own hashed downloads.
    default: "3.12"
  override:
    description: >-
      A path (relative to the workspace, or absolute) to install the tools from instead
      of the locked revision: a product's self-test of its own tree.
    default: ""
  fetch-token:
    description: >-
      A token that reads private profile and pin repositories, exported as
      <P>_FETCH_TOKEN for pin-path and the org profile fetch.
    default: ""
  working-directory:
    description: The checkout whose flake.lock pins the engine.
    default: "."
  hardened:
    description: >-
      "true" installs from the engine's committed uv.lock by hash, with a pinned uv and no
      cache, from `source` only (see above): for a job that can hold a GitHub App's key.
    default: "false"
  source:
    description: >-
      With `hardened`: the only owner/repo flake.lock may lock the engine from
      (`Kit/kit-nix`), compared without case. Not used with `override`.
    default: ""
  project:
    description: >-
      With `hardened`: the directory in the engine repository (or in `override`) that
      holds the tools' pyproject.toml and uv.lock (`py/kit_nix_tools`).
    default: ""
  git-sources:
    description: >-
      With `hardened`: the owner/repo list (space-separated) a git dependency in uv.lock
      may come from, at a full revision. Empty refuses every git dependency.
    default: ""
  build-requirements:
    description: >-
      With `hardened`: the build backend the project and its git dependencies are built
      with, one `name==version --hash=sha256:<hex>` per line.
    default: "flit-core==3.12.0 --hash=sha256:e7a0304069ea895172e3c7bb703292e992c5d1555dd1233ab7b5621b5b69e62c"

outputs:
  rev:
    description: The engine revision installed (empty with `override`).
    value: ${{ steps.install.outputs.rev }}
  version:
    description: What `<cli> --version` prints.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - if: inputs.hardened != 'true'
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        # Saving the cache uploads it; from a self-hosted runner that is slow and outlasts
        # the job, so only hosted runners save it.
        enable-cache: ${{ runner.environment == 'github-hosted' }}
        tool-dir: ${{ runner.temp }}/uv-tool-dir
        tool-bin-dir: ${{ runner.temp }}/uv-tool-bin-dir

    # hardened is for a job that holds a GitHub App's key, which runs on a fresh
    # GitHub-hosted runner, never a shared self-hosted one; and the uv checksum below is
    # x86_64 Linux's.
    - if: inputs.hardened == 'true'
      shell: bash
      env:
        ENVIRONMENT: ${{ runner.environment }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        if [ "$ENVIRONMENT/$OS/$ARCH" != github-hosted/Linux/X64 ]; then
          echo "::error title=standards-install::hardened runs only on a GitHub-hosted Linux X64 runner, not $ENVIRONMENT/$OS/$ARCH"
          exit 1
        fi

    # A cache another job saved (one that ran a pull request's code, say) is never
    # restored here: uv is pinned, checked against the sha256 of its release asset
    # (uv-x86_64-unknown-linux-gnu.tar.gz, whatever setup-uv's own table says), and runs
    # without one. setup-uv skips that check when the version is already in the tool
    # cache, so install.sh checks the binary too (UV_SHA256, the `uv` in that asset).
    - if: inputs.hardened == 'true'
      id: uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.6"
        checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
        enable-cache: "false"

    - id: install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLI: ${{ inputs.cli }}
        ENGINE_INPUT: ${{ inputs.engine-input }}
        INSTALL_SPEC: ${{ inputs.install-spec }}
        ENV_PREFIX: ${{ inputs.env-prefix }}
        PYTHON: ${{ inputs.python }}
        OVERRIDE: ${{ inputs.override }}
        FETCH_TOKEN: ${{ inputs.fetch-token }}
        HARDENED: ${{ inputs.hardened }}
        SOURCE: ${{ inputs.source }}
        PROJECT: ${{ inputs.project }}
        GIT_SOURCES: ${{ inputs.git-sources }}
        BUILD_REQUIREMENTS: ${{ inputs.build-requirements }}
        UV: ${{ steps.uv.outputs.uv-path }}
        # uv 0.13.6's x86_64-unknown-linux-gnu binary, from the asset whose sha256 is the
        # checksum above.
        UV_SHA256: 23803452c0fbe125033054cd9ff245f1d649fb65b4b73f68429f4abda432436d
        # The source repositories' history, read with the job's own token: never the
        # GitHub App's, whatever the caller's job puts in GH_TOKEN.
        API_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
