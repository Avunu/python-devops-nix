# standards-core: the managed-files, profile, CI and fleet engine that product plugins
# build on (DESIGN.md). Products depend on it from git (a `subdirectory=standards` URL)
# or through lib.standards.package; it has no console script, since each product owns
# its own command line.
[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "standards-core"
# x-release-please-start-version
version = "1.5.0"
# x-release-please-end
description = "Managed files, profiles, CI steps and fleet tools for product plugins"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jinja2>=3.1,<4", "tomlkit>=0.13", "packaging>=24", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.flit.module]
name = "standards_core"
